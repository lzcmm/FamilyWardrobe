name: FamilyWardrobe
options:
  bundleIdPrefix: com.familywardrobe
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    # SWIFT_VERSION 只接受 4.0/4.2/5.0/6.0，写 "5.10" 会被 Xcode 判为不支持
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FamilyWardrobe:
    type: application
    platform: iOS
    sources:
      - path: FamilyWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familywardrobe.app
        PRODUCT_NAME: FamilyWardrobe
        INFOPLIST_FILE: FamilyWardrobe/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  FamilyWardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamilyWardrobeTests
    dependencies:
      - target: FamilyWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.familywardrobe.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  FamilyWardrobe:
    build:
      targets:
        FamilyWardrobe: all
        FamilyWardrobeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyWardrobeTests
    archive:
      config: Release
