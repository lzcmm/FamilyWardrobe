name: iOS Unsigned Build

# ==============================================================
# 在 GitHub 官方 macOS runner 上编译 iOS App（未签名）
#
# 为什么用这个而不是本地：
#   本机是 Windows，没有 Xcode，编译不了 iOS。
#   GitHub 提供免费的 macOS runner，10–15 分钟出一个未签名 .ipa。
#
# 为什么编译未签名：
#   免费 Apple ID 签出来的证书只能 7 天有效期，且不能用于分发。
#   所以策略是：云端编译 → 下载 .ipa → 本机 Sideloadly 用你的 Apple ID 签名。
#
# 触发方式：Actions → iOS Unsigned Build → Run workflow
# ==============================================================

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        type: choice
        options:
          - Release
          - Debug
        default: Release
      run_tests:
        description: '是否运行测试'
        type: boolean
        default: true

  # 推 main 时自动构建（文档改动除外，省 macOS 分钟）
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'Tools/**'
      - 'FamilyWardrobeTests/**'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS
    # macOS 15 Intel runner 是独立的容量池（4 核 / 14 GB，公开仓库免费无限）。
    # 不要用 macos-15：那个 label 指向 arm64 M1 池（3 核 / 7 GB），
    # 容量紧张时会出现 "job was not acquired by Runner ... even after multiple attempts"
    # 并在排队十几分钟后被取消（run 43028031930 就是这么挂的）。
    runs-on: macos-15-intel
    timeout-minutes: 45

    env:
      PROJECT_NAME: FamilyWardrobe
      SCHEME: FamilyWardrobe
      CONFIGURATION: ${{ github.event.inputs.configuration || 'Release' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true
          # 优先 Xcode 16.x：项目用 Swift 5 语言模式 + iOS 17 部署目标，与 Xcode 16 最匹配；
          # 避免 tail -1 意外选到 Xcode 26 后触发 Swift 6 的严格并发检查。
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1)
          if [ -z "$XCODE" ]; then
            XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v beta | sort | tail -1)
          fi
          if [ -z "$XCODE" ]; then
            echo "❌ 未找到 Xcode"
            exit 1
          fi
          echo "Using $XCODE"
          # xcode-select 要的是 Developer 目录，不是 .app bundle
          sudo xcode-select -switch "${XCODE}/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate
          ls -la FamilyWardrobe.xcodeproj

      - name: Show available simulators
        run: |
          xcrun simctl list runtimes | head -20

      - name: Run tests
        # 测试失败不阻断出包：首次构建的主要目标是拿到编译诊断，
        # Swift Testing 依赖的模拟器环境在不同 runner 上可能缺失。
        continue-on-error: true
        if: ${{ github.event.inputs.run_tests != 'false' && github.event_name == 'workflow_dispatch' }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project FamilyWardrobe.xcodeproj \
            -scheme FamilyWardrobe \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test-output.log
          echo "=== Test Summary ==="
          grep -E "Test Suite|Executed [0-9]+ test" test-output.log | tail -20 || true

      - name: Build simulator app
        run: |
          set -o pipefail
          # 用 generic destination，不绑定具体机型名，避免 runner 上找不到该模拟器
          xcodebuild build \
            -project FamilyWardrobe.xcodeproj \
            -scheme FamilyWardrobe \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build-output.log
          echo "=== Build Result ==="
          ls -la build/Build/Products/Debug-iphonesimulator/ || true

      - name: Build unsigned device app
        run: |
          set -o pipefail
          # 编译真机架构但不做签名 —— 供 Sideloadly 本地签名用
          xcodebuild build \
            -project FamilyWardrobe.xcodeproj \
            -scheme FamilyWardrobe \
            -configuration $CONFIGURATION \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build-device-output.log

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build-device/Build/Products -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 没有找到 .app"
            ls -R build-device/Build/Products || true
            exit 1
          fi
          echo "打包: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          # .app 内的 Info.plist 已在包里，Sideloadly 会自行改写 bundle id 与签名；
          # 不要在 Payload 根目录创建多余的空 Info.plist。

          mkdir -p artifacts
          IPA="artifacts/${PROJECT_NAME}-unsigned.ipa"
          zip -qry "$IPA" Payload
          rm -rf Payload
          echo "✅ 生成: $IPA"
          ls -la artifacts/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyWardrobe-unsigned-ipa
          path: artifacts/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: FamilyWardrobe-simulator-app
          path: build/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 30
          if-no-files-found: ignore

      - name: Print compile errors
        if: failure()
        run: |
          echo "========== 编译器错误（修复依据）=========="
          for f in build-output.log build-device-output.log test-output.log; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            grep -E "(^|: )(error|warning): |fatal error: |BUILD FAILED" "$f" | head -80 || true
          done
          echo "========================================="

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-output.log
            build-device-output.log
            test-output.log
          retention-days: 7
          if-no-files-found: ignore
